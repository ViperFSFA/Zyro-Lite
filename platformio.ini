;  Zyro-Lite. LilyGO T-Deck Plus (SX1262 868MHz variant)
[env:t-deck-plus]
board = esp32-s3-devkitc-1       
framework = arduino
extra_scripts = pre:extra_scripts/fix_toolchain_path.py

platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.36/platform-espressif32.zip

board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
board_build.psram_type = opi
board_build.arduino.memory_type = qio_opi
board_build.partitions = huge_app.csv   ; large single app partition, plenty for this firmware
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216

monitor_speed = 115200
upload_speed = 921600

build_flags =
    -D BOARD_HAS_PSRAM
    -D ARDUINO_USB_MODE=1          
    -D ARDUINO_USB_CDC_ON_BOOT=1    
    -D CORE_DEBUG_LEVEL=1
    -mfix-esp32-psram-cache-issue

lib_deps =
    moononournation/GFX Library for Arduino @ ^1.6.6 
    jgromes/RadioLib @ ^6.6.0
    mikalhart/TinyGPSPlus @ ^1.0.3
    bitbank2/AnimatedGIF @ ^2.1.1
    h2zero/NimBLE-Arduino @ ^1.4.1
